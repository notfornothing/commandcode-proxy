services:
  proxy:
    build: .
    network_mode: host
    environment:
      # 与 nginx 反代目标一致（原 compose 端口映射 127.0.0.1:13050→3050）
      PORT: "13050"
      CC_STREAM_IDLE_MS: "300000"
      CC_NONSTREAM_IDLE_MS: "300000"
      # 本机没有公网 IPv6；强制 IPv4，避免 Node 先连 IPv6 失败。出网直连，不走 7890
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:13050/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
