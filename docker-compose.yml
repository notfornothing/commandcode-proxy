services:
  proxy:
    build: .
    ports:
      # 宿主机只绑回环，避免和本机 3050 或其他服务抢端口；容器内仍是 3050
      - "127.0.0.1:${PROXY_PORT:-13050}:3050"
    environment:
      PORT: "3050"
      CC_STREAM_IDLE_MS: "300000"
      CC_NONSTREAM_IDLE_MS: "300000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:3050/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
